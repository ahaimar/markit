server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

spring:
  application:
    name: api-gateway
  boot:
    admin:
      client:
        url: ${ADMIN_URL:http://localhost:8086}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - ${CORS_ORIGINS:http://localhost:3000}
                allowedMethods: "*"
                allowedHeaders: "*"
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: user-service
                    fallbackUri: forward:/fallback
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: product-service
                    fallbackUri: forward:/fallback
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: order-service
                    fallbackUri: forward:/fallback
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: notification-service
                    fallbackUri: forward:/fallback
            - id: task-service
              uri: lb://task-service
              predicates:
                - Path=/api/tasks/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: task-service
                    fallbackUri: forward:/fallback

app:
  jwt:
    secret: ${JWT_SECRET:markit-dev-secret-key-change-me-in-production-0123456789}
  rate-limit:
    per-ip: ${RATE_LIMIT_PER_IP:100}
    per-user: ${RATE_LIMIT_PER_USER:1000}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}