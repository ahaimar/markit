spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: user-service
                    fallbackUri: forward:/fallback
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: product-service
                    fallbackUri: forward:/fallback
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: order-service
                    fallbackUri: forward:/fallback
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: notification-service
                    fallbackUri: forward:/fallback
            - id: task-service
              uri: lb://task-service
              predicates:
                - Path=/api/tasks/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: task-service
                    fallbackUri: forward:/fallback
  data:
    redis:
      url: ${REDIS_URL:redis://redis:6379}

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://zipkin:9411/api/v2/spans}

app:
  jwt:
    secret: ${JWT_SECRET:markit-dev-secret-key-change-me-in-production-0123456789}
  rate-limit:
    per-ip: ${RATE_LIMIT_PER_IP:100}
    per-user: ${RATE_LIMIT_PER_USER:1000}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}