# Markit microservices stack: infrastructure + discovery + services + frontend.
# Single-command start:  docker compose up --build  (nginx on https://localhost)
#
# Boot order (enforced by health checks):
#   1. Databases & Brokers (postgres, kafka, redis, zipkin)
#   2. Discovery (eureka)
#   3. Monitoring (admin-server)
#   4. Business microservices (user, product, order, notification, task)
#   5. API Gateway + Frontend (nginx, web)
services:
  postgres:
    image: postgres:16-alpine
    container_name: markit-postgres
    environment:
      POSTGRES_USER: markit
      POSTGRES_PASSWORD: markit
      POSTGRES_DB: markit
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
      - markit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markit"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.7
    container_name: markit-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 15s
      timeout: 10s
      retries: 6

  redis:
    image: redis:7-alpine
    container_name: markit-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - markit-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: markit-zipkin
    ports:
      - "9411:9411"
    environment:
      STORAGE_TYPE: mem
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: markit-discovery-server
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8761'"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  admin-server:
    build:
      context: .
      dockerfile: admin-server/Dockerfile
    container_name: markit-admin-server
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8086'"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: markit-user-service
    expose:
      - "8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_URL: http://discovery-server:8761/eureka/
      ADMIN_URL: http://admin-server:8086
      ADMIN_SEED_ENABLED: ${ADMIN_SEED_ENABLED:-true}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-admin@markit.com}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-admin}
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:443/auth/oauth/google/callback}
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8081'"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: markit-product-service
    expose:
      - "8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_URL: http://discovery-server:8761/eureka/
      ADMIN_URL: http://admin-server:8086
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8082'"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: markit-order-service
    expose:
      - "8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_URL: http://discovery-server:8761/eureka/
      ADMIN_URL: http://admin-server:8086
      PRODUCT_SERVICE_URL: http://product-service:8082
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8083'"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: markit-notification-service
    expose:
      - "8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_URL: http://discovery-server:8761/eureka/
      ADMIN_URL: http://admin-server:8086
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8084'"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  task-service:
    build:
      context: .
      dockerfile: task-service/Dockerfile
    container_name: markit-task-service
    expose:
      - "8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_URL: http://discovery-server:8761/eureka/
      ADMIN_URL: http://admin-server:8086
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8085'"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: markit-api-gateway
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_URL: http://discovery-server:8761/eureka/
      ADMIN_URL: http://admin-server:8086
      JWT_SECRET: ${JWT_SECRET:-markit-dev-secret-key-change-me-in-production-0123456789}
      RATE_LIMIT_PER_IP: ${RATE_LIMIT_PER_IP:-100}
      RATE_LIMIT_PER_USER: ${RATE_LIMIT_PER_USER:-1000}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      REDIS_URL: redis://redis:6379
      MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      redis:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      task-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080'"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: markit-web
    expose:
      - "3000"
    environment:
      NEXT_PUBLIC_API_MODE: ${NEXT_PUBLIC_API_MODE:-live}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://api-gateway:8080}
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: markit-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api-gateway:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  markit-postgres-data:
  markit-redis-data:
