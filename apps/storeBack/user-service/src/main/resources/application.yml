server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%X{requestId:-} %5p"

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:h2:mem:userdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: user_service
  flyway:
    create-schemas: true
    schemas: user_service
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  jwt:
    secret: ${JWT_SECRET:markit-dev-secret-key-change-me-in-production-0123456789}
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 604800
  oauth:
    google:
      enabled: ${GOOGLE_OAUTH_ENABLED:false}
      auth-uri: ${GOOGLE_OAUTH_AUTH_URI:https://accounts.google.com/o/oauth2/v2/auth}
  kafka:
    user-events-topic: user-events
  outbox:
    publish-interval-ms: 3000