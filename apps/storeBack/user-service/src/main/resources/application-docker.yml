spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/markit
    username: markit
    password: markit
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        default_schema: user_service
  flyway:
    create-schemas: true
    schemas: user_service
  kafka:
    bootstrap-servers: kafka:9092

app:
  admin-seed:
    enabled: ${ADMIN_SEED_ENABLED:true}
    email: ${ADMIN_SEED_EMAIL:admin@markit.com}
    password: ${ADMIN_SEED_PASSWORD:admin}